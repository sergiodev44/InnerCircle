{% extends "base.html" %}

{% block main %}
<div style="max-width: 400px; margin: 40px auto;">
    <h2>Set New Password</h2>
    {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Set Password</button>
        </form>
    {% else %}
        <p>The password reset link is invalid or has expired.</p>
        <p><a href="{% url 'inner_circle:password_reset' %}">Request a new password reset</a></p>
    {% endif %}
</div>
{% endblock %}
