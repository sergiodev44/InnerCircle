{% extends "base.html" %}

{% block main %}
<div style="max-width: 400px; margin: 40px auto;">
    <h2>Reset Password</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send Reset Link</button>
    </form>
    <p><a href="{% url 'login' %}">Back to login</a></p>
</div>
{% endblock %}
