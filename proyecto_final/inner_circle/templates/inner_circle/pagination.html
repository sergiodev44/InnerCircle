<nav style="margin-top: 20px; display: flex; justify-content: center; gap: 10px; padding: 10px; background-color: #f9f9f9; border-radius: 4px;">
    {% if page_obj.has_previous %}
        <a href="?page=1{% for key, value in request.GET.items %}{% if key != 'page' %}&{{ key }}={{ value }}{% endif %}{% endfor %}" style="padding: 5px 10px; border: 1px solid #ddd; border-radius: 4px;">«</a>
        <a href="?page={{ page_obj.previous_page_number }}{% for key, value in request.GET.items %}{% if key != 'page' %}&{{ key }}={{ value }}{% endif %}{% endfor %}" style="padding: 5px 10px; border: 1px solid #ddd; border-radius: 4px;">‹</a>
    {% else %}
        <span style="padding: 5px 10px; color: #ccc;">«</span>
        <span style="padding: 5px 10px; color: #ccc;">‹</span>
    {% endif %}
    
    <span style="padding: 5px 10px; font-weight: bold;">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
    
    {% if page_obj.has_next %}
        <a href="?page={{ page_obj.next_page_number }}{% for key, value in request.GET.items %}{% if key != 'page' %}&{{ key }}={{ value }}{% endif %}{% endfor %}" style="padding: 5px 10px; border: 1px solid #ddd; border-radius: 4px;">›</a>
        <a href="?page={{ page_obj.paginator.num_pages }}{% for key, value in request.GET.items %}{% if key != 'page' %}&{{ key }}={{ value }}{% endif %}{% endfor %}" style="padding: 5px 10px; border: 1px solid #ddd; border-radius: 4px;">»</a>
    {% else %}
        <span style="padding: 5px 10px; color: #ccc;">›</span>
        <span style="padding: 5px 10px; color: #ccc;">»</span>
    {% endif %}
</nav>
